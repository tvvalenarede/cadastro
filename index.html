<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TV Vale na Rede - Cadastro de Clientes</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', Arial, sans-serif; }
  body {
    background: linear-gradient(135deg, #0b1e3a, #16365c);
    min-height:100vh; color:#fff; padding:20px;
  }
  h1 { text-align:center; margin-bottom:20px; font-size:1.8rem; color:#ffd700; text-shadow:2px 2px 4px #000; }

  /* Tela de login */
  #loginScreen {
    max-width:400px; margin:100px auto; background:#1e4b7a; padding:40px 30px;
    border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,.6); text-align:center;
  }
  #loginScreen h2 { margin-bottom:20px; color:#ffd700; }
  #loginScreen input {
    width:100%; padding:12px; margin-bottom:15px; border:none; border-radius:8px;
    font-size:1rem; text-align:center;
  }
  #loginScreen button {
    width:100%; padding:12px; background:#ffd700; color:#0b1e3a; border:none;
    border-radius:8px; font-weight:bold; font-size:1rem; cursor:pointer;
    transition:.3s;
  }
  #loginScreen button:hover { background:#ffed4a; transform:scale(1.03); }

  /* App */
  #app { display:none; max-width:1200px; margin:0 auto; }

  .form-box {
    background:#1e4b7a; padding:20px; border-radius:12px; margin-bottom:20px;
    box-shadow:0 5px 20px rgba(0,0,0,.4);
  }
  .form-box h3 { margin-bottom:15px; color:#ffd700; }
  .grid {
    display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap:12px;
  }
  .grid input, .grid select, .grid textarea {
    padding:10px; border:none; border-radius:8px; font-size:.95rem; width:100%;
    font-family: inherit;
  }
  .grid textarea { resize: vertical; min-height:60px; grid-column: 1 / -1; }

  .btn {
    padding:11px 20px; border:none; border-radius:8px; font-weight:bold;
    cursor:pointer; font-size:.95rem; transition:.25s; margin-top:12px;
  }
  .btn-add { background:#28a745; color:#fff; }
  .btn-add:hover { background:#34c759; }
  .btn-backup { background:#007bff; color:#fff; }
  .btn-backup:hover { background:#3395ff; }
  .btn-save { background:#ffc107; color:#000; }
  .btn-save:hover { background:#ffd54a; }
  .btn-exit { background:#dc3545; color:#fff; }
  .btn-exit:hover { background:#ff4d5e; }
  .btn-del { background:#dc3545; color:#fff; padding:6px 10px; font-size:.8rem; }

  .actions { display:flex; flex-wrap:wrap; gap:10px; margin-bottom:20px; }

  .search-box input {
    width:100%; padding:12px; border:none; border-radius:8px; margin-bottom:15px;
    font-size:1rem;
  }

  .table-wrap { overflow-x:auto; border-radius:10px; }
  table { width:100%; border-collapse:collapse; background:#fff; color:#000; min-width:900px; }
  th, td { padding:10px; text-align:left; font-size:.85rem; border-bottom:1px solid #ddd; vertical-align:top; }
  th { background:#0b1e3a; color:#ffd700; white-space:nowrap; }
  tr:hover td { background:#f1f8ff; }

  .empty { text-align:center; padding:30px; color:#ffd700; font-weight:bold; }
  .counter { text-align:right; margin-bottom:10px; color:#ffd700; font-weight:bold; }
</style>
</head>
<body>

<h1>📺 TV Vale na Rede</h1>

<!-- LOGIN -->
<div id="loginScreen">
  <h2>🔒 Acesso Restrito</h2>
  <input type="password" id="senhaInput" placeholder="Digite a senha">
  <button onclick="entrar()">Entrar</button>
  <p id="loginMsg" style="margin-top:15px;color:#ff6b6b;"></p>
</div>

<!-- APP -->
<div id="app">
  <div class="form-box">
    <h3>➕ Cadastrar Cliente</h3>
    <div class="grid">
      <input type="text" id="nome" placeholder="Nome do Cliente *">
      <input type="text" id="telefone" placeholder="Telefone">
      <input type="text" id="cidade" placeholder="Cidade">
      <input type="text" id="cnpj" placeholder="CNPJ">
      <input type="text" id="supermercado" placeholder="Nome do Supermercado">
      <input type="text" id="endSupermercado" placeholder="End. do Supermercado">
      <input type="text" id="plano" placeholder="Plano / Serviço">
      <input type="date" id="dataCad">
      <textarea id="trabalho" placeholder="Trabalho a ser feito"></textarea>
    </div>
    <button class="btn btn-add" onclick="cadastrar()">Cadastrar Cliente</button>
    <span id="msgCad" style="margin-left:15px;font-weight:bold;"></span>
  </div>

  <div class="actions">
    <button class="btn btn-backup" onclick="backup()">💾 Fazer Backup</button>
    <button class="btn btn-save" onclick="salvarDados()">✅ Salvar Dados</button>
    <button class="btn btn-exit" onclick="sair()">🚪 Sair do Site</button>
  </div>

  <div class="search-box">
    <input type="text" id="busca" placeholder="🔍 Buscar por nome, supermercado, CNPJ..." oninput="renderizar()">
  </div>

  <div class="counter" id="contador"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Cliente</th>
          <th>Telefone</th>
          <th>Cidade</th>
          <th>CNPJ</th>
          <th>Supermercado</th>
          <th>End. Supermercado</th>
          <th>Plano</th>
          <th>Trabalho a ser feito</th>
          <th>Data</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody id="tabela"></tbody>
    </table>
  </div>
  <div id="vazio" class="empty" style="display:none;">Nenhum cliente cadastrado ainda.</div>
</div>

<script>
/* ===============================
   CONFIGURAÇÃO
=============================== */
const SENHA = "tvvalenarede20";
const MAX_CLIENTES = 100;
const STORAGE_KEY = "tvValeClientes";

let clientes = [];

/* ===============================
   LOGIN
=============================== */
function entrar() {
  const senha = document.getElementById("senhaInput").value;
  const msg = document.getElementById("loginMsg");
  if (senha === SENHA) {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("app").style.display = "block";
    carregarDados();
  } else {
    msg.textContent = "❌ Senha incorreta. Tente novamente.";
    document.getElementById("senhaInput").value = "";
  }
}
document.getElementById("senhaInput").addEventListener("keypress", e => {
  if (e.key === "Enter") entrar();
});

/* ===============================
   LOCALSTORAGE
=============================== */
function carregarDados() {
  const dados = localStorage.getItem(STORAGE_KEY);
  if (dados) {
    try { clientes = JSON.parse(dados); } catch(e) { clientes = []; }
  }
  renderizar();
}

function salvarDados(silencioso = false) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(clientes));
  if (!silencioso) mostrarMsgCad("💾 Dados salvos com sucesso!", "ok");
}

/* ===============================
   CADASTRO
=============================== */
function cadastrar() {
  const nome = document.getElementById("nome").value.trim();
  const telefone = document.getElementById("telefone").value.trim();
  const cidade = document.getElementById("cidade").value.trim();
  const cnpj = document.getElementById("cnpj").value.trim();
  const supermercado = document.getElementById("supermercado").value.trim();
  const endSupermercado = document.getElementById("endSupermercado").value.trim();
  const plano = document.getElementById("plano").value.trim();
  const trabalho = document.getElementById("trabalho").value.trim();
  const dataCad = document.getElementById("dataCad").value || new Date().toISOString().slice(0,10);

  if (!nome && !supermercado) {
    mostrarMsgCad("⚠️ Informe o nome do cliente ou do supermercado.", "err");
    return;
  }
  if (clientes.length >= MAX_CLIENTES) {
    mostrarMsgCad("⚠️ Limite de 100 clientes atingido!", "err");
    return;
  }

  clientes.push({
    nome, telefone, cidade, cnpj,
    supermercado, endSupermercado, plano, trabalho, dataCad
  });
  salvarDados(true);
  limparForm();
  renderizar();
  mostrarMsgCad("✅ Cliente cadastrado com sucesso!", "ok");
}

function limparForm() {
  ["nome","telefone","cidade","cnpj","supermercado","endSupermercado","plano","trabalho","dataCad"]
    .forEach(id => document.getElementById(id).value = "");
}

function mostrarMsgCad(texto, tipo) {
  const el = document.getElementById("msgCad");
  el.textContent = texto;
  el.style.color = tipo === "ok" ? "#7CFC8A" : "#ff6b6b";
  setTimeout(() => { el.textContent = ""; }, 3000);
}

/* ===============================
   RENDERIZAÇÃO
=============================== */
function renderizar() {
  const busca = document.getElementById("busca").value.toLowerCase();
  const tbody = document.getElementById("tabela");
  const vazio = document.getElementById("vazio");
  tbody.innerHTML = "";

  const filtrados = clientes.filter(c =>
    (c.nome || "").toLowerCase().includes(busca) ||
    (c.supermercado || "").toLowerCase().includes(busca) ||
    (c.cnpj || "").toLowerCase().includes(busca) ||
    (c.cidade || "").toLowerCase().includes(busca)
  );

  if (filtrados.length === 0) {
    vazio.style.display = "block";
    vazio.textContent = busca ? "Nenhum cliente encontrado." : "Nenhum cliente cadastrado ainda.";
  } else {
    vazio.style.display = "none";
    filtrados.forEach((c) => {
      const realIndex = clientes.indexOf(c);
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${realIndex + 1}</td>
        <td>${escapeHtml(c.nome) || "-"}</td>
        <td>${escapeHtml(c.telefone) || "-"}</td>
        <td>${escapeHtml(c.cidade) || "-"}</td>
        <td>${escapeHtml(c.cnpj) || "-"}</td>
        <td>${escapeHtml(c.supermercado) || "-"}</td>
        <td>${escapeHtml(c.endSupermercado) || "-"}</td>
        <td>${escapeHtml(c.plano) || "-"}</td>
        <td>${escapeHtml(c.trabalho) || "-"}</td>
        <td>${c.dataCad}</td>
        <td><button class="btn btn-del" onclick="excluir(${realIndex})">Excluir</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  document.getElementById("contador").textContent =
    `Clientes cadastrados: ${clientes.length} / ${MAX_CLIENTES}`;
}

function escapeHtml(txt) {
  if (!txt) return "";
  return txt.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function excluir(index) {
  if (confirm("Deseja realmente excluir este cliente?")) {
    clientes.splice(index, 1);
    salvarDados(true);
    renderizar();
  }
}

/* ===============================
   BACKUP (Download JSON)
=============================== */
function backup() {
  if (clientes.length === 0) {
    alert("Não há clientes para fazer backup.");
    return;
  }
  const data = new Date().toISOString().slice(0,10);
  const blob = new Blob([JSON.stringify(clientes, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `backup_tv_vale_rede_${data}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ===============================
   SAIR (salva e retorna ao login)
=============================== */
function sair() {
  salvarDados(true);
  if (confirm("Dados salvos! Deseja realmente sair do site?")) {
    document.getElementById("app").style.display = "none";
    document.getElementById("loginScreen").style.display = "block";
    document.getElementById("senhaInput").value = "";
    document.getElementById("loginMsg").textContent = "";
  }
}

/* Salva automaticamente ao fechar a aba */
window.addEventListener("beforeunload", () => {
  if (document.getElementById("app").style.display === "block") {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(clientes));
  }
});
</script>
</body>
</html>
